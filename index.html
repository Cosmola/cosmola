    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmola Official Website</title>

    <style>
        /* --- 1. Design Tokens & Grid Background --- */
        :root {
            --bg-color: #faf9f5;
            --bg-color-rgba: rgba(250, 249, 245, 0.85);
            --text-color: #111111;
            --text-muted: #888888;
            --accent-line: rgba(231, 76, 60, 0.4);
            --font-main: "Helvetica Neue", Helvetica, Arial, "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            line-height: 2;
            letter-spacing: 0.12em;
            -webkit-font-smoothing: antialiased;
        }

        body {
            position: relative;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.025'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* --- 2. Common Layout --- */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 8vw;
        }

        section {
            padding: 160px 0;
            position: relative;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(40px);
            filter: blur(4px);
            transition: opacity 1.2s ease, transform 1.2s ease, filter 1.2s ease;
            will-change: opacity, transform, filter;
        }
        .fade-in.active {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* --- 3. Typography --- */
        .section-title {
            font-size: 2rem;
            margin-bottom: 80px;
            font-weight: 500;
            display: inline-block;
            position: relative;
            letter-spacing: 0.1em;
        }

        .section-title::after {
            content: " .";
            color: var(--accent-line);
            font-size: 3rem;
            position: absolute;
            bottom: 4px;
            right: -20px;
            line-height: 0;
        }

        .sub-title {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        /* --- 4. Header & Navigation --- */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 25px 8vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background-color: var(--bg-color-rgba);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.02);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: 0.03em;
            line-height: 1;
        }

        .logo-icon {
            width: 24px;
            height: auto;
            filter: brightness(0) contrast(100%);
            object-fit: contain;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            transition: color 0.3s;
        }
        nav a:hover {
            color: var(--text-muted);
        }

        /* --- 5. TOP Section --- */
        #top {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .top-hero-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .top-logo-image {
            width: 320px;
            height: auto;
            display: block;
            pointer-events: none;
            filter: brightness(0) contrast(100%);
        }

        .scroll-hint {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            letter-spacing: 0.15em;
        }
        
        .scroll-hint::after {
            content: "";
            width: 1px; height: 40px;
            background-color: var(--text-muted);
            display: block;
        }

        /* --- 6. MOVIES Section --- */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 100px 60px;
        }

        .movie-item:nth-child(odd) {
            transform: translateY(50px);
        }

        .movie-link {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #eae9e5;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.03);
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s;
        }

        .movie-link:hover .thumbnail-container img {
            transform: scale(1.02);
            filter: grayscale(0%);
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 4px;
        }

        .movie-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .movie-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* --- 7. LIVE Section --- */
        .live-group {
            margin-bottom: 60px;
        }

        .live-list {
            list-style: none;
            max-width: 850px;
        }

        .live-item {
            padding: 24px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 30px;
            align-items: baseline;
        }

        .live-date {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--text-color);
        }

        .live-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .live-detail-title {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .live-detail-venue {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        .past-live-list .live-item {
            padding: 16px 0;
            opacity: 0.8;
        }

        .past-live-list .live-date {
            color: var(--text-muted);
        }

        /* --- 8. ABOUT & BIOGRAPHY Section --- */
        .about-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 100px;
            margin-bottom: 80px;
        }

        .about-box {
            font-size: 0.85rem;
            text-align: justify;
            line-height: 2.2;
        }

        .about-box.jp {
            font-weight: 300;
        }

        .about-box p {
            margin-bottom: 30px;
        }

        .about-box.en {
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.08em;
        }

        /* Biography 表示 */
        .bio-container {
            margin-top: 60px;
            padding-top: 60px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            max-width: 850px;
        }

        .bio-list {
            list-style: none;
        }

        .bio-item {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 20px;
            padding: 16px 0;
            font-size: 0.85rem;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.05);
        }

        .bio-date {
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .bio-text {
            font-weight: 300;
            line-height: 1.8;
        }

        .bio-tag-release {
            display: inline-block;
            font-size: 0.65rem;
            padding: 1px 6px;
            margin-right: 8px;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            border-radius: 3px;
            letter-spacing: 0.05em;
            vertical-align: middle;
        }

        /* --- 9. LINKS Section --- */
        .links-list {
            list-style: none;
            max-width: 500px;
        }

        .links-list li {
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .menu-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            text-decoration: none;
            color: inherit;
            transition: padding-left 0.3s ease;
        }

        .menu-link:hover {
            padding-left: 10px;
        }

        .link-label {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .link-url {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            font-weight: 400;
        }

        /* --- 10. Footer --- */
        footer {
            padding: 120px 0 60px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            font-weight: 400;
        }

        /* --- 11. Responsive --- */
        @media (max-width: 768px) {
            header {
                padding: 20px 6vw;
            }
            nav ul {
                gap: 15px;
            }
            nav a {
                font-size: 0.7rem;
            }
            section {
                padding: 100px 0;
            }
            .top-logo-image {
                width: 220px;
            }
            .movie-grid {
                grid-template-columns: 1fr;
                gap: 60px;
            }
            .movie-item:nth-child(odd) {
                transform: translateY(0);
            }
            .about-wrapper {
                grid-template-columns: 1fr;
                gap: 60px;
            }
            .live-item {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .bio-item {
                grid-template-columns: 1fr;
                gap: 4px;
            }
        }
    </style>
</head>

            // 1. Movies生成
            const movieGrid = document.getElementById('movie-grid');
            movieGrid.innerHTML = SITE_DATA.movies.map(movie => `
                <div class="movie-item fade-in">
                    <a href="https://youtu.be/${movie.id}" target="_blank" rel="noopener noreferrer" class="movie-link">
                        <div class="thumbnail-container">
                            <img src="https://img.youtube.com/vi/${movie.id}/maxresdefault.jpg" alt="${movie.title}">
                        </div>
                        <div class="movie-meta">
                            <span class="movie-name">${movie.title}</span>
                            <span class="movie-date">${movie.year}</span>
                        </div>
                    </a>
                </div>
            `).join('');

            // 2. Live (Upcoming) 生成
            const upcomingList = document.getElementById('upcoming-live-list');
            if (SITE_DATA.upcomingLives.length === 0) {
                upcomingList.innerHTML = '<li style="color:var(--text-muted); font-size:0.85rem;">現在予定されているライブはありません。</li>';
            } else {
                upcomingList.innerHTML = SITE_DATA.upcomingLives.map(live => `
                    <li class="live-item">
                        <div class="live-date">${live.date}</div>
                        <div class="live-info">
                            <div class="live-detail-title">${live.title}</div>
                            <div class="live-detail-venue">${live.venue} ${live.time ? ' / ' + live.time : ''}</div>
                        </div>
                    </li>
                `).join('');
            }

            // 3. Live (Past) 生成
            const pastList = document.getElementById('past-live-list');
            pastList.innerHTML = SITE_DATA.pastLives.map(live => `
                <li class="live-item">
                    <div class="live-date">${live.date}</div>
                    <div class="live-info">
                        <div class="live-detail-venue">${live.venue}</div>
                    </div>
                </li>
            `).join('');

            // 4. About本文生成
            document.getElementById('about-jp').innerHTML = SITE_DATA.about.jp.map(p => `<p>${p}</p>`).join('');
            document.getElementById('about-en').innerHTML = SITE_DATA.about.en.map(p => `<p>${p}</p>`).join('');

            // 5. Biography生成
            const bioList = document.getElementById('bio-list');
            bioList.innerHTML = SITE_DATA.biography.map(item => `
                <li class="bio-item">
                    <span class="bio-date">${item.date}</span>
                    <span class="bio-text">
                        ${item.isRelease ? '<span class="bio-tag-release">RELEASE</span>' : ''}${item.text}
                    </span>
                </li>
            `).join('');

            // 6. Links生成
            document.getElementById('links-list').innerHTML = SITE_DATA.links.map(link => `
                <li>
                    <a href="${link.url}" ${link.url.startsWith('mailto:') ? '' : 'target="_blank" rel="noopener noreferrer"'} class="menu-link">
                        <span class="link-label">${link.label}</span>
                        <span class="link-url">${link.displayUrl}</span>
                    </a>
                </li>
            `).join('');

            // スクロールフェードインのアニメーション
            const fadeElements = document.querySelectorAll('.fade-in');
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        obs.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            fadeElements.forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
